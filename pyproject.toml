[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "b3-2d"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pyvista",
    "rich",
    "treeparse",
    "b3_state", 
    "cgfoil", # @ git+https://github.com/wr1/cgfoil.git@dev1",
    "matplotlib",
    "numpy",
    "pydantic>=2.0",
]
#  @ git+https://github.com/wr1/b3_state.git@master",

[project.scripts]
b3-2d = "b3_2d.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
[tool.hatch.metadata]
allow-direct-references = true

